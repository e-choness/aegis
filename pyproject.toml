# Aegis v2 — uv workspace root
# This is a virtual workspace root (no installable package).
# All publishable packages live under packages/.

[tool.uv.workspace]
members = ["packages/*", "sdk/python"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "pre-commit>=4",
    "import-linter>=2.15",
    "aegis-gateway-pack-pii[pii]",
    # spaCy model the PII pack loads by default. Not on PyPI, so it's pinned by
    # URL here for the dev env; users install it with `python -m spacy download`.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "aegis-gateway-pack-llm-guard",
    "aegis-gateway-core[rag]",
    "aegis-gateway-pack-classification",
    "aegis-gateway-pack-residency",
    "aegis-gateway-pack-budgets",
    "aegis-gateway-sdk",
    # Docs — the site itself is VitePress (see package.json); this lints its Python snippets.
    "pytest-examples>=0.0.13",
    # Changelog drafting
    "git-cliff>=2.0",
]

[tool.uv]
# LLM Guard (last released May 2025) pins exact, vulnerable versions of
# transformers and json-repair, and an old Presidio that caps cryptography.
# Resolving its extra separately keeps those pins from holding back the rest of
# the workspace. Its tests stub the library, so the dev env doesn't install it.
conflicts = [
    [
        { package = "aegis-gateway-pack-llm-guard", extra = "llm-guard" },
        { package = "aegis-gateway-pack-pii", extra = "pii" },
    ],
    [
        { package = "aegis-gateway-pack-llm-guard", extra = "all" },
        { package = "aegis-gateway-pack-pii", extra = "pii" },
    ],
    [
        { package = "aegis-gateway-pack-llm-guard", extra = "llm-guard" },
        { package = "aegis-gateway-pack-pii", extra = "all" },
    ],
    [
        { package = "aegis-gateway-pack-llm-guard", extra = "all" },
        { package = "aegis-gateway-pack-pii", extra = "all" },
    ],
]

[tool.uv.sources]
aegis-gateway-pack-pii = { workspace = true }
aegis-gateway-pack-llm-guard = { workspace = true }
aegis-gateway-core = { workspace = true }
aegis-gateway-pack-classification = { workspace = true }
aegis-gateway-pack-residency = { workspace = true }
aegis-gateway-pack-budgets = { workspace = true }
aegis-gateway-sdk = { workspace = true }

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["packages", "sdk/python"]
asyncio_mode = "auto"
# Show short test summary for failures only
addopts = "-rN --import-mode=importlib"

# ── ruff (shared config — ruff.toml takes precedence for lint rules) ──────────
# ruff settings live in ruff.toml at the root.

# ── pyright ───────────────────────────────────────────────────────────────────
# pyright settings live in pyrightconfig.json at the root.
