# Weekly, grouped update PRs. CI's dependency audit (scripts/audit-deps.sh)
# catches new advisories between these runs.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      docs-toolchain:
        patterns: ["*"]
    # vitepress-plugin-mermaid@2 declares a mermaid 10/11 peer; package.json
    # overrides it to our mermaid. Drop the override once the plugin supports 12.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/huggingface
    schedule:
      interval: weekly
