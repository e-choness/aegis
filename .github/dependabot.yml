# Weekly, grouped update PRs. CI's dependency audit (scripts/audit-deps.sh)
# catches new advisories between these runs.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      docs-toolchain:
        patterns: ["*"]
    ignore:
      # vitepress-plugin-mermaid@2 only supports mermaid 10/11 (npm ci fails on 12),
      # and mermaid 12.0 pulls in a vulnerable lodash-es. Revisit when the plugin
      # declares mermaid 12 support.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/huggingface
    schedule:
      interval: weekly
