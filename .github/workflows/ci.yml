name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install workspace dependencies
        run: docker compose run --rm dev uv sync --all-packages

      - name: Dependency vulnerabilities (pip-audit + npm audit)
        run: docker compose run --rm dev bash scripts/audit-deps.sh

      - name: Lint (ruff)
        run: docker compose run --rm dev uv run ruff check .

      - name: Type-check (pyright)
        run: docker compose run --rm dev uv run pyright

      - name: Import contracts (packs use public APIs only)
        run: docker compose run --rm dev uv run lint-imports

      - name: OpenAPI spec is up to date
        run: docker compose run --rm dev uv run python scripts/export_openapi.py --check

      - name: Run tests
        run: docker compose run --rm dev uv run pytest -q

      - name: Docs snippet and README checks
        run: docker compose run --rm dev uv run pytest tests/docs -q

      - name: Build docs (VitePress — fails on dead internal links)
        run: docker compose run --rm dev bash -c "npm ci && npm run docs:build"

      - name: Link-check docs (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --base-url https://e-choness.github.io
            --exclude 'https://e-choness\.github\.io'
            --exclude 'localhost'
            docs/.vitepress/dist/

      - name: Run demo smoke test
        run: docker compose run --rm dev bash scripts/demo.sh --ci

      - name: Run standalone examples
        run: |
          docker compose run --rm dev uv run python examples/01_governed_chat.py
          docker compose run --rm dev uv run python examples/03_mcp_tool.py
          docker compose run --rm dev uv run python examples/04_rag.py
          docker compose run --rm dev uv run python examples/05_residency.py

      - name: Approval scenario (README demo, end to end)
        run: docker compose run --rm dev bash scripts/approval-scenario.sh

      - name: Teardown
        if: always()
        run: docker compose down -v
