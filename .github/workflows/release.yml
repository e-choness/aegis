name: Release

# Push a tag like v2.0.0a3 — the tag *is* the version of every package
# (hatch-vcs); nothing in the repo needs bumping first. Re-running the workflow
# for the same tag is safe: files already on PyPI are skipped, the GitHub
# Release is updated, and the Space is re-uploaded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v2.0.0a1"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # tags and history, for hatch-vcs

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Version from the tag
        id: version
        run: |
          version=$(uv run --no-project --with packaging python -c \
            "import sys; from packaging.version import Version; print(Version(sys.argv[1].removeprefix('v')))" "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Pin internal dependencies to this release
        run: uv run --no-project --with packaging python scripts/release.py pin "$TAG"

      - name: Build the published packages (never the test fixture plugin)
        env:
          # The pin step leaves the checkout modified, which would make hatch-vcs
          # compute the *next* dev version; state the tag's version explicitly.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pkg in $(uv run --no-project --with packaging python scripts/release.py packages); do
            uv build "$pkg" --out-dir dist
          done
          ls -l dist

      - name: Every file is exactly the tag's version
        run: uv run --no-project --with packaging python scripts/release.py verify "$TAG" dist

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aegis-gateway/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing — no API token stored in GitHub
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The umbrella pins every component to this exact version, so it must be
      # published last: if any component fails, aegis-gateway never goes up and
      # `pip install aegis-gateway` keeps resolving to the previous release.
      - name: Hold the umbrella package back
        run: |
          mkdir umbrella
          mv dist/aegis_gateway-[0-9]* umbrella/
          ls dist umbrella

      - name: Publish components
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          print-hash: true

      - name: Publish aegis-gateway (only after every component succeeded)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: umbrella/
          skip-existing: true
          print-hash: true

  github-release:
    name: GitHub Release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Release notes from docs/changelog.md
        run: |
          {
            uv run --no-project --with packaging python scripts/release.py notes "$TAG"
            echo
            echo "---"
            echo "\`pip install aegis-gateway==${{ needs.build.outputs.version }}\` · [Documentation](https://e-choness.github.io/aegis/) · [Full changelog](https://e-choness.github.io/aegis/changelog)"
          } > notes.md

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          body_path: notes.md
          prerelease: ${{ contains(needs.build.outputs.version, 'a') || contains(needs.build.outputs.version, 'b') || contains(needs.build.outputs.version, 'rc') }}
          files: dist/*

  huggingface-space:
    name: Deploy demo Space
    needs: [build, pypi]
    runs-on: ubuntu-latest
    # Set repository variable HF_SPACE_ID (e.g. e-choness/aegis-demo) and
    # secret HF_TOKEN (write access) to enable; otherwise this job is skipped.
    if: vars.HF_SPACE_ID != ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Wait until the release is installable from PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/aegis-gateway-cli/$VERSION/json" > /dev/null; then
              echo "aegis-gateway-cli $VERSION is live"; exit 0
            fi
            sleep 20
          done
          echo "::error::aegis-gateway-cli $VERSION not visible on PyPI after 10 minutes"; exit 1

      - name: Pin the Space to this release
        run: sed -i "s/__AEGIS_VERSION__/${{ needs.build.outputs.version }}/" deploy/huggingface/Dockerfile

      - uses: astral-sh/setup-uv@v10.2.0

      # huggingface_hub reports any auth failure as "repo not found", so check
      # the token explicitly and fail with an actionable message.
      - name: Check the Hugging Face token can write to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is empty in this job. Add it as a *repository* secret (Settings → Secrets and variables → Actions → Secrets); environment secrets aren't visible to this job."
            exit 1
          fi
          uv run --no-project --with huggingface_hub python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["SPACE"]
          try:
              me = api.whoami()
          except Exception as exc:
              sys.exit(f"::error::HF_TOKEN was rejected by Hugging Face ({exc.__class__.__name__}). Create a new token with write access.")
          print(f"Token belongs to: {me['name']}")
          role = (me.get("auth", {}).get("accessToken", {}) or {}).get("role")
          if role == "read":
              sys.exit(f"::error::HF_TOKEN is read-only. Create a token with write access to {space}.")
          owner = space.split("/")[0]
          if owner not in {me["name"], *(o["name"] for o in me.get("orgs", []))}:
              sys.exit(f"::error::HF_TOKEN belongs to {me['name']!r}, which can't write to {space!r}.")
          api.space_info(space)  # fine-grained tokens without access to this Space fail here
          print(f"OK: {me['name']} can reach {space}")
          PY

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # --delete removes anything in the Space that isn't in deploy/huggingface
          # (e.g. the full source tree the old rsync-based sync copied there).
          uvx --from huggingface_hub hf upload "${{ vars.HF_SPACE_ID }}" deploy/huggingface . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy Aegis ${{ needs.build.outputs.version }}"
