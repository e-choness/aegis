[project]
name = "aegis-gateway-pack-llm-guard"
dynamic = ["version"]
description = "Aegis policy pack: LLM Guard scanners (prompt injection, toxicity, secrets)."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Aegis contributors" }]
keywords = ["llm", "ai-gateway", "guardrails", "openai", "governance", "audit", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = ["aegis-gateway-core"]

[project.optional-dependencies]
llm-guard = ["llm-guard>=0.3"]
all = ["aegis-gateway-pack-llm-guard[llm-guard]"]

[project.urls]
Homepage = "https://e-choness.github.io/aegis/"
Documentation = "https://e-choness.github.io/aegis/"
Repository = "https://github.com/e-choness/aegis"
Changelog = "https://e-choness.github.io/aegis/changelog"
Issues = "https://github.com/e-choness/aegis/issues"

[tool.uv.sources]
aegis-gateway-core = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version is the git tag: v2.0.0a3 → 2.0.0a3; between tags → 2.0.0a4.devN.
source = "vcs"
raw-options = { root = "../..", local_scheme = "no-local-version", fallback_version = "0.0.0.dev0" }

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_pack_llm_guard"]

[project.entry-points."aegis.guardrails"]
llm_guard = "aegis_pack_llm_guard:LlmGuardAdapter"

[project.entry-points."aegis.packs"]
"aegis.llm_guard" = "aegis_pack_llm_guard.factory:from_config"
