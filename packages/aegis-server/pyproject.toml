[project]
name = "aegis-gateway-server"
dynamic = ["version"]
description = "Aegis HTTP server: OpenAI-compatible and native APIs, auth, approvals and evidence ledger."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Aegis contributors" }]
keywords = ["llm", "ai-gateway", "guardrails", "openai", "governance", "audit", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "aegis-gateway-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
]

[project.entry-points."aegis.exporters"]
jsonl = "aegis_server.exporters:JsonlExporter"
webhook = "aegis_server.exporters:WebhookExporter"

[project.urls]
Homepage = "https://e-choness.github.io/aegis/"
Documentation = "https://e-choness.github.io/aegis/"
Repository = "https://github.com/e-choness/aegis"
Changelog = "https://e-choness.github.io/aegis/changelog"
Issues = "https://github.com/e-choness/aegis/issues"

[tool.uv.sources]
aegis-gateway-core = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version is the git tag: v2.0.0a3 → 2.0.0a3; between tags → 2.0.0a4.devN.
source = "vcs"
raw-options = { root = "../..", local_scheme = "no-local-version", fallback_version = "0.0.0.dev0" }

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_server"]
