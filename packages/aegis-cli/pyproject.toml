[project]
name = "aegis-gateway-cli"
version = "2.0.0a0"
description = "The aegis command-line tool: serve, lint, explain, approve and audit."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Aegis contributors" }]
keywords = ["llm", "ai-gateway", "guardrails", "openai", "governance", "audit", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "aegis-gateway-core==2.0.0a0",
    "aegis-gateway-sdk==2.0.0a0",
    "aegis-gateway-server==2.0.0a0",
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://e-choness.github.io/aegis/"
Documentation = "https://e-choness.github.io/aegis/"
Repository = "https://github.com/e-choness/aegis"
Changelog = "https://e-choness.github.io/aegis/changelog"
Issues = "https://github.com/e-choness/aegis/issues"

[project.scripts]
aegis = "aegis_cli.main:run"

[tool.uv.sources]
aegis-gateway-core = { workspace = true }
aegis-gateway-sdk = { workspace = true }
aegis-gateway-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_cli"]
