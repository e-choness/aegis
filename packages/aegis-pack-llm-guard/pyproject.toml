[project]
name = "aegis-gateway-pack-llm-guard"
version = "2.0.0a0"
description = "Aegis policy pack: LLM Guard scanners (prompt injection, toxicity, secrets)."
license = { text = "MIT" }
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Aegis contributors" }]
keywords = ["llm", "ai-gateway", "guardrails", "openai", "governance", "audit", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = ["aegis-gateway-core==2.0.0a0"]

[project.optional-dependencies]
llm-guard = ["llm-guard>=0.3"]
all = ["aegis-gateway-pack-llm-guard[llm-guard]"]

[project.urls]
Homepage = "https://e-choness.github.io/aegis/"
Documentation = "https://e-choness.github.io/aegis/"
Repository = "https://github.com/e-choness/aegis"
Changelog = "https://github.com/e-choness/aegis/blob/main/CHANGELOG.md"
Issues = "https://github.com/e-choness/aegis/issues"

[tool.uv.sources]
aegis-gateway-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_pack_llm_guard"]

[project.entry-points."aegis.guardrails"]
llm_guard = "aegis_pack_llm_guard:LlmGuardAdapter"

[project.entry-points."aegis.packs"]
"aegis.llm_guard" = "aegis_pack_llm_guard.factory:from_config"
