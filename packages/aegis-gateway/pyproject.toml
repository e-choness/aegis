[project]
name = "aegis-gateway"
dynamic = ["version"]
description = "Self-hosted AI gateway: guardrails, human approvals and a tamper-evident audit ledger behind an OpenAI-compatible API."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Aegis contributors" }]
keywords = ["llm", "ai-gateway", "guardrails", "openai", "governance", "audit", "pii"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "aegis-gateway-cli",
    "aegis-gateway-core",
    "aegis-gateway-server",
    "aegis-gateway-pack-pii[pii]",
    "aegis-gateway-pack-llm-guard",
    "aegis-gateway-pack-classification",
    "aegis-gateway-pack-residency",
    "aegis-gateway-pack-budgets",
]

[project.urls]
Homepage = "https://e-choness.github.io/aegis/"
Documentation = "https://e-choness.github.io/aegis/"
Repository = "https://github.com/e-choness/aegis"
Changelog = "https://e-choness.github.io/aegis/changelog"
Issues = "https://github.com/e-choness/aegis/issues"

[tool.uv.sources]
aegis-gateway-cli = { workspace = true }
aegis-gateway-core = { workspace = true }
aegis-gateway-server = { workspace = true }
aegis-gateway-pack-pii = { workspace = true }
aegis-gateway-pack-llm-guard = { workspace = true }
aegis-gateway-pack-classification = { workspace = true }
aegis-gateway-pack-residency = { workspace = true }
aegis-gateway-pack-budgets = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version is the git tag: v2.0.0a3 → 2.0.0a3; between tags → 2.0.0a4.devN.
source = "vcs"
raw-options = { root = "../..", local_scheme = "no-local-version", fallback_version = "0.0.0.dev0" }

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_gateway"]
