services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      UV_CACHE_DIR: /workspace/.uv-cache
    env_file:
      - path: .env.publish
        required: false
    stdin_open: true
    tty: true

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Docs profile ──────────────────────────────────────────────────────────
  # Live-reloading VitePress preview:  docker compose --profile docs up docs
  # Then open http://localhost:5173/aegis/
  docs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: [docs]
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: bash -c "npm ci && npm run docs:dev -- --port 5173"
    ports:
      - "5173:5173"

  # ── Codegen profile ───────────────────────────────────────────────────────
  # Activate with:  docker compose --profile codegen run --rm codegen generate ...
  # Example (Go):
  #   docker compose run --rm codegen generate \
  #     -i /workspace/openapi.json -g go -o /workspace/.tmp/go-client
  codegen:
    image: openapitools/openapi-generator-cli:latest
    profiles: [codegen]
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["docker-entrypoint.sh"]

volumes:
  postgres_data:
