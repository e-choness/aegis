<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Aegis</title>
  <desc id="d">Aegis — a self-hosted AI gateway. A request travels through ingress, route, execute and egress stages; every guardrail verdict lands in a hash-chained ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="1" stop-color="#0e1b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="0.5" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#f2551d"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b1a36" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="shieldClip">
      <path d="M200 70 L292 104 V186 C292 250 252 290 200 312 C148 290 108 250 108 186 V104 Z"/>
    </clipPath>
    <clipPath id="frame"><rect width="1280" height="400" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }

    .draw { stroke-dasharray: 760; stroke-dashoffset: 0; animation: draw 9s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 760; } 18% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }

    .pulse { transform-origin: 200px 190px; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

    .scan { animation: scan 4.5s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(260px); } }

    .dot { opacity: .25; }
    .node { animation: node 6s ease-out infinite; }
    @keyframes node { 0% { opacity: 1; } 12% { opacity: 1; } 30% { opacity: .25; } 100% { opacity: .25; } }
    .n0 { animation-delay: 0s; } .n1 { animation-delay: 1s; } .n2 { animation-delay: 2s; }
    .n3 { animation-delay: 3s; } .n4 { animation-delay: 4s; } .n5 { animation-delay: 5s; }

    .chip { opacity: 0; animation: chip 12s ease-in-out infinite; }
    .chip.c0 { opacity: 1; }
    @keyframes chip { 0% { opacity: 0; transform: translateY(6px); } 3% { opacity: 1; transform: translateY(0); } 22% { opacity: 1; transform: translateY(0); } 25% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 0; } }
    .c0 { animation-delay: 0s; } .c1 { animation-delay: 3s; } .c2 { animation-delay: 6s; } .c3 { animation-delay: 9s; }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .twinkle { animation: tw 5s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <!-- ambient particles -->
    <g fill="#60a5fa">
      <circle class="twinkle" cx="420" cy="48" r="1.6" style="animation-delay:.4s"/>
      <circle class="twinkle" cx="610" cy="92" r="1.2" style="animation-delay:1.7s"/>
      <circle class="twinkle" cx="880" cy="40" r="1.8" style="animation-delay:2.9s"/>
      <circle class="twinkle" cx="1110" cy="120" r="1.3" style="animation-delay:.9s"/>
      <circle class="twinkle" cx="1225" cy="260" r="1.5" style="animation-delay:3.6s"/>
      <circle class="twinkle" cx="60" cy="330" r="1.4" style="animation-delay:2.2s"/>
      <circle class="twinkle" cx="330" cy="355" r="1.1" style="animation-delay:4.1s"/>
    </g>

    <!-- shield -->
    <circle cx="200" cy="190" r="170" fill="url(#glow)" class="pulse"/>
    <path d="M200 70 L292 104 V186 C292 250 252 290 200 312 C148 290 108 250 108 186 V104 Z" fill="url(#shieldFill)"/>
    <g clip-path="url(#shieldClip)">
      <path d="M200 70 V312 M108 180 H292" stroke="#3b82f6" stroke-width="1.2" opacity=".45"/>
      <g stroke="#1e40af" stroke-width="1" opacity=".5" fill="none">
        <path d="M128 130 H170 V150 H185"/><path d="M230 128 H262 V160"/>
        <path d="M135 220 H168 V250"/><path d="M226 214 H270 M246 214 V262"/>
      </g>
      <rect class="scan" x="100" y="60" width="200" height="16" fill="url(#sweep)" opacity=".55"/>
    </g>
    <path class="draw" d="M200 70 L292 104 V186 C292 250 252 290 200 312 C148 290 108 250 108 186 V104 Z" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round"/>
    <path d="M200 92 L272 118 V186 C272 238 240 270 200 288 C160 270 128 238 128 186 V118 Z" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity=".6"/>
    <path d="M186 124 L214 124 L200 148 Z" fill="#ff7a2e"/>
    <circle cx="200" cy="190" r="9" fill="#dbeafe" class="pulse"/>

    <!-- wordmark -->
    <path id="wordmark" aria-label="AEGIS" d="M404.58 98.26Q415.44 98.26 423.50 102.51Q431.57 106.77 436.05 115.06Q440.53 123.34 440.53 135.10L440.53 178L422.38 178L422.38 159.18L386.54 159.18L386.54 178L368.62 178L368.62 135.10Q368.62 123.34 373.10 115.06Q377.58 106.77 385.65 102.51Q393.71 98.26 404.58 98.26M386.54 144.62L422.38 144.62L422.38 133.42Q422.38 123.68 417.57 118.70Q412.75 113.71 404.46 113.71Q396.06 113.71 391.30 118.70Q386.54 123.68 386.54 133.42M522.91 157.62L528.51 171.28Q522.91 175.09 514.46 177.22Q506 179.34 496.48 179.34Q484.61 179.34 476.32 176.38Q468.03 173.41 463.78 168.09Q459.52 162.77 459.52 155.94Q459.52 149.66 462.99 144.85Q466.46 140.03 472.51 137.68Q467.92 135.22 465.40 130.96Q462.88 126.70 462.88 121.44Q462.88 115.06 466.80 109.79Q470.72 104.53 478.67 101.39Q486.62 98.26 498.16 98.26Q505.78 98.26 513.06 99.77Q520.34 101.28 525.71 103.86L520.67 117.74Q510.37 112.93 498.83 112.93Q490.10 112.93 485.67 115.56Q481.25 118.19 481.25 122.67Q481.25 126.82 484.22 129Q487.18 131.18 493.23 131.18L514.62 131.18L514.62 145.52L492.11 145.52Q485.28 145.52 481.58 147.87Q477.89 150.22 477.89 154.70Q477.89 159.41 482.65 162.04Q487.41 164.67 497.26 164.67Q504.21 164.67 511.15 162.82Q518.10 160.98 522.91 157.62M598.13 158.85L598.13 137.57L614.70 137.57L614.70 178L601.04 178L601.04 173.30Q592.86 179.34 579.98 179.34Q569.12 179.34 560.05 174.64Q550.98 169.94 545.60 160.92Q540.22 151.90 540.22 139.47Q540.22 127.49 545.77 118.14Q551.31 108.78 561.17 103.52Q571.02 98.26 583.34 98.26Q593.65 98.26 602.05 101.73Q610.45 105.20 616.16 111.81L604.51 122.56Q596.11 113.71 584.24 113.71Q576.74 113.71 570.91 116.90Q565.09 120.10 561.84 125.92Q558.59 131.74 558.59 139.36Q558.59 147.31 561.78 152.91Q564.98 158.51 570.35 161.37Q575.73 164.22 582.11 164.22Q591.63 164.22 598.13 158.85M677.94 114.16L664.38 114.16L664.38 163.44L677.94 163.44L677.94 178L632.58 178L632.58 163.44L646.24 163.44L646.24 114.16L632.58 114.16L632.58 99.60L677.94 99.60M723.36 179.34Q714.06 179.34 705.38 176.82Q696.70 174.30 691.44 170.27L697.60 156.61Q702.64 160.30 709.58 162.54Q716.53 164.78 723.47 164.78Q731.20 164.78 734.90 162.49Q738.59 160.19 738.59 156.38Q738.59 153.58 736.41 151.74Q734.22 149.89 730.81 148.77Q727.39 147.65 721.57 146.30Q712.61 144.18 706.90 142.05Q701.18 139.92 697.10 135.22Q693.01 130.51 693.01 122.67Q693.01 115.84 696.70 110.30Q700.40 104.75 707.85 101.50Q715.30 98.26 726.05 98.26Q733.55 98.26 740.72 100.05Q747.89 101.84 753.26 105.20L747.66 118.98Q736.80 112.82 725.94 112.82Q718.32 112.82 714.68 115.28Q711.04 117.74 711.04 121.78Q711.04 125.81 715.24 127.77Q719.44 129.73 728.06 131.63Q737.02 133.76 742.74 135.89Q748.45 138.02 752.54 142.61Q756.62 147.20 756.62 155.04Q756.62 161.76 752.87 167.30Q749.12 172.85 741.62 176.10Q734.11 179.34 723.36 179.34" fill="url(#word)"/>
    <text x="364" y="226" class="sans" font-size="26" fill="#c9d5ea">The self-hosted AI gateway that shows its work.</text>
    <text x="364" y="260" class="mono" font-size="16" fill="#6f86ab">OpenAI-compatible · plugin-first · every verdict hash-chained<tspan class="caret" fill="#ff7a2e"> ▍</tspan></text>

    <!-- verdict ticker -->
    <g transform="translate(1016 62)">
      <text x="0" y="0" class="mono" font-size="13" fill="#6f86ab">verdict</text>
      <g class="chip c0"><rect x="0" y="10" width="200" height="34" rx="17" fill="#052e1c" stroke="#22c55e"/><text x="100" y="32" class="mono" font-size="15" fill="#4ade80" text-anchor="middle">● allow</text></g>
      <g class="chip c1"><rect x="0" y="10" width="200" height="34" rx="17" fill="#0b2447" stroke="#60a5fa"/><text x="100" y="32" class="mono" font-size="15" fill="#93c5fd" text-anchor="middle">◐ sanitize</text></g>
      <g class="chip c2"><rect x="0" y="10" width="200" height="34" rx="17" fill="#3a0d0d" stroke="#ef4444"/><text x="100" y="32" class="mono" font-size="15" fill="#f87171" text-anchor="middle">■ block</text></g>
      <g class="chip c3"><rect x="0" y="10" width="200" height="34" rx="17" fill="#3a2605" stroke="#f59e0b"/><text x="100" y="32" class="mono" font-size="15" fill="#fbbf24" text-anchor="middle">⏸ require_approval</text></g>
    </g>

    <!-- pipeline strip -->
    <g transform="translate(0 330)">
      <path d="M380 0 H1180" stroke="#1e3a5f" stroke-width="2"/>
      <path d="M380 0 H1180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 10" opacity=".6">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/>
      </path>
      <g fill="#0e1b33" stroke="#3b82f6" stroke-width="2">
        <circle cx="380" cy="0" r="7"/><circle cx="540" cy="0" r="7"/><circle cx="700" cy="0" r="7"/>
        <circle cx="860" cy="0" r="7"/><circle cx="1020" cy="0" r="7"/><circle cx="1180" cy="0" r="7"/>
      </g>
      <g fill="#93c5fd">
        <circle class="node n0" cx="380" cy="0" r="4"/><circle class="node n1" cx="540" cy="0" r="4"/>
        <circle class="node n2" cx="700" cy="0" r="4"/><circle class="node n3" cx="860" cy="0" r="4"/>
        <circle class="node n4" cx="1020" cy="0" r="4"/><circle class="node n5" cx="1180" cy="0" r="4" fill="#ff7a2e"/>
      </g>
      <g class="mono" font-size="13" fill="#8da2c4" text-anchor="middle">
        <text x="380" y="30">request</text><text x="540" y="30">ingress</text><text x="700" y="30">route</text>
        <text x="860" y="30">execute</text><text x="1020" y="30">egress</text><text x="1180" y="30" fill="#ffb070">ledger</text>
      </g>
      <circle r="6" fill="#ff7a2e" cx="380" cy="0">
        <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.84;1" calcMode="linear" path="M0 0 H800"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.84;0.9;1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
