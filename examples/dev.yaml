# dev.yaml — zero-credential development config for `aegis serve`
# Run: aegis serve --config examples/dev.yaml --no-auth
#
# Uses FakeProvider so no API keys are needed.
# PII masking and budgets are enabled for local dogfooding. `budget` is listed
# in ingress (reject principals over their cap) and egress (charge each run).

providers:
  fake:
    type: fake
    complete_response: "[dev] hello from Aegis"

guardrails:
  pii:
    pack: aegis.pii
    mode: mask
  budget:
    pack: aegis.budgets
    default_cap: 100.0

pipeline:
  ingress: [budget, pii]
  egress: [pii, budget]

routes:
  default:
    provider: fake

auth:
  type: none
