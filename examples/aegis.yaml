# aegis.yaml — example Aegis gateway configuration
# Run `aegis config validate examples/aegis.yaml` to check this file.

providers:
  anthropic_main:
    type: anthropic
    api_key: secret://env/ANTHROPIC_API_KEY#value
    residency:
      region: us

  local:
    type: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen2.5

guardrails:
  pii:
    pack: aegis.pii
    mode: mask
  classify:
    pack: aegis.classification
  content_policy:
    pack: aegis.policy
    rules:
      - when: {label: classification, in: [secret]}
        verdict: block
        reason: credentials must not be sent to a model

pipeline:
  ingress: [classify, content_policy, pii]
  egress: [pii]
  # Tools are governed per route: see `tools:` / `tool_guards:` in the docs.

routes:
  default:
    provider: anthropic_main
    model: claude-sonnet-4-5
  drafts:
    provider: local
    model: qwen2.5

auth:
  type: none
