<rect width="1000" height="430" rx="12" fill="#0b1220" stroke="#1e2d45"/>
<rect width="1000" height="36" rx="12" fill="#111b2e"/><rect y="24" width="1000" height="12" fill="#111b2e"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="500" y="23" fill="#6f86ab" text-anchor="middle" style="font-size:13px">aegis — examples/scenarios/02_approval_flow.py</text>
<g class="l0"><text x="24" y="64" fill="#ff7a2e">$</text><text x="40.9" y="64" fill="#e6edf3">aegis runs create "Applicant SIN is 046-454-286, assess risk" --route underwriting</text><rect class="t0" transform="translate(721.8 0)" x="40.9" y="48" width="721.8" height="22" fill="#0b1220"/></g>
<text class="l1" x="24" y="88" fill="#9fb0c8" xml:space="preserve">run_id: 13cdfd49</text>
<text class="l2" x="24" y="112" fill="#fbbf24" xml:space="preserve">status: paused</text>
<g class="l3"><text x="24" y="136" fill="#ff7a2e">$</text><text x="40.9" y="136" fill="#e6edf3">AEGIS_API_KEY=$JANE_KEY aegis runs deny 13cdfd49</text><rect class="t3" transform="translate(434.49999999999994 0)" x="40.9" y="120" width="434.49999999999994" height="22" fill="#0b1220"/></g>
<text class="l4" x="24" y="160" fill="#9fb0c8" xml:space="preserve">Run 13cdfd49 denied: status=denied</text>
<g class="l5"><text x="24" y="184" fill="#ff7a2e">$</text><text x="40.9" y="184" fill="#e6edf3">aegis explain 13cdfd49</text><rect class="t5" transform="translate(214.79999999999998 0)" x="40.9" y="168" width="214.79999999999998" height="22" fill="#0b1220"/></g>
<text class="l6" x="24" y="208" fill="#e6edf3" xml:space="preserve">run 13cdfd49  route=underwriting  principal=svc-underwriting  status=denied</text>
<line class="l7" x1="24" x2="976" y1="227" y2="227" stroke="#2a3a55" stroke-dasharray="2 3"/>
<text class="l8" x="24" y="256" fill="#fbbf24" xml:space="preserve">  guard     residency_ca   REQUIRE_APPROVAL  region 'us-east-1' not in allowed ['ca-central-1']</text>
<text class="l9" x="24" y="280" fill="#f87171" xml:space="preserve">  ingress   residency_ca   DENIED            run denied by reviewer</text>
<line class="l10" x1="24" x2="976" y1="299" y2="299" stroke="#2a3a55" stroke-dasharray="2 3"/>
<text class="l11" x="24" y="328" fill="#5f7190" xml:space="preserve">  short-circuited at ingress/residency_ca · provider never called</text>
<g class="l12"><text x="24" y="352" fill="#ff7a2e">$</text><text x="40.9" y="352" fill="#e6edf3">aegis audit export -o ledger.jsonl &amp;&amp; aegis audit verify ledger.jsonl</text><rect class="t12" transform="translate(611.9499999999999 0)" x="40.9" y="336" width="611.9499999999999" height="22" fill="#0b1220"/></g>
<text class="l13" x="24" y="376" fill="#4ade80" xml:space="preserve">OK  7 record(s) verified — chain is intact.</text>
<text x="24" y="400" fill="#ff7a2e">$ <tspan class="cursor" fill="#e6edf3">▍</tspan></text>
</svg>
