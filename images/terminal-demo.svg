.l6{animation:l6 18s linear infinite}@keyframes l6{0%,37.78%{opacity:0}37.83%,92.22%{opacity:1}96.67%,100%{opacity:0}}
.l7{animation:l7 18s linear infinite}@keyframes l7{0%,38.33%{opacity:0}38.39%,92.22%{opacity:1}96.67%,100%{opacity:0}}
